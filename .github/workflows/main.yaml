# Nama workflow yang akan tampil di tab Actions GitHub
name: 🚀 Run Preprocessing Workflow

on:
  push:
    branches: [ main, master ] # Memicu workflow saat ada 'push'
    paths:
      # Hanya jalankan jika file-file ini berubah
      - 'preprocessing/automate_HajatulHiqmah.py'
      - 'wine_quality/winequality-red.csv'
      
  pull_request:
    branches: [ main, master ] # Memicu workflow saat ada 'pull request'
    paths:
      # Hanya jalankan jika file-file ini berubah
      - 'preprocessing/automate_HajatulHiqmah.py'
      - 'wine_quality/winequality-red.csv'

jobs:
  # Nama job
  preprocess-data:
    # Menggunakan sistem operasi Ubuntu terbaru
    runs-on: ubuntu-latest

    steps:
      # Langkah 1: Meng-checkout kode repositori Anda
      - name: Checkout repository
        uses: actions/checkout@v4

      # Langkah 2: Menyiapkan lingkungan Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' 

      # Langkah 3: Menginstal dependencies (hanya pandas)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
      
      # Langkah 4: Menjalankan skrip Python untuk preprocessing
      - name: Run preprocessing script
        run: python preprocessing/automate_HajatulHiqmah.py

      # Langkah 5: Meng-upload hasil data bersih sebagai "artifact"
      - name: Upload processed dataset
        uses: actions/upload-artifact@v4
        with:
          name: processed-wine-dataset # Nama artifact
          path: preprocessing/namadataset_preprocessing/wine_processed.csv # Path ke file output
